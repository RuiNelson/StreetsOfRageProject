[package]
name = "streets-of-rage-builder"
version = "0.3.0"
description = "Guided builder for Streets of Rage"
edition = "2024"

[lib]
name = "streets_of_rage_builder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc = "3.4.0"
